name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Must run before setup-node: its yarn cache lookup needs the Yarn 4 shim from packageManager.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      # public/mockServiceWorker.js is git-ignored, and the Pages build serves the MSW mocks instead of a backend.
      - name: Generate MSW worker
        run: yarn msw init public --no-save

      - name: Build
        run: yarn build:pages

      # GitHub Pages has no SPA fallback: deep links such as /dashboard would otherwise return its own 404 page.
      - name: SPA fallback
        run: cp docs/index.html docs/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  Deploy:
    needs: Build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
